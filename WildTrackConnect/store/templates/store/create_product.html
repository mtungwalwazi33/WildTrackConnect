{% extends 'store/base.html' %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<div class="form-container">

    <h1 class="page-title">Add New Product</h1>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="form-group">

            <label for="name">Product Name</label>

            <input type="text" id="name" name="name" required>

        </div>

        <div class="form-group">

            <label for="description">Description</label>

            <textarea id="description" name="description"></textarea>

        </div>

        <div class="form-group">

            <label for="price">Price ($)</label>

            <input type="number" id="price" name="price" step="0.01" required>

        </div>

        <div class="form-group">

            <label for="stock">Stock Quantity</label>

            <input type="number" id="stock" name="stock" value="0">

        </div>

        <div class="form-group">

            <label for="category">Category</label>

            <select id="category" name="category">

                <option value="">Select Category</option>

                <option value="accommodation" {% if category == 'accommodation' %}selected{% endif %}>Safari Accommodation</option>

                <option value="game_drives" {% if category == 'game_drives' %}selected{% endif %}>Game Drives</option>

                <option value="camping" {% if category == 'camping' %}selected{% endif %}>Camping Equipment</option>

                <option value="photography" {% if category == 'photography' %}selected{% endif %}>Photography Equipment</option>

                <option value="hunting" {% if category == 'hunting' %}selected{% endif %}>Hunting Equipment</option>

                <option value="drones" {% if category == 'drones' %}selected{% endif %}>Monitoring Drones</option>

            </select>

        </div>

        <div class="form-group">

            <label for="image">Product Image</label>

            <input type="file" id="image" name="image" accept="image/*">

        </div>

        <button type="submit" class="btn">Create Product</button>

    </form>

</div>

{% endblock %}
