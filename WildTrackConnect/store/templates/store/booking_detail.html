{% extends 'store/base.html' %}

{% block title %}
Booking {{ booking_id }}
{% endblock %}

{% block content %}

<div class="page-title" style="margin-top:30px;">Booking #{{ booking_id }}</div>

<div style="max-width:700px; margin:0 auto; padding:0 8% 80px;">

    <div style="background:white; padding:40px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.04); border:1px solid rgba(0,0,0,0.04); text-align:center;">

        <p style="font-size:18px; color:#4b5563; margin-bottom:20px;">Your booking details would appear here.</p>

        <a href="{% url 'bookings' %}" class="btn">Back to Bookings</a>

    </div>

</div>

{% endblock %}
